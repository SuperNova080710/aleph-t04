<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 진짜 정보판 · 스팀 동접자</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2e3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #7aa2f7;
      --success: #9ece6a;
      --error: #f7768e;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;          /* 스크롤 제거 */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      padding: 16px 20px;
      line-height: 1.45;
    }

    header {
      flex: none;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: clamp(18px, 2.4vw, 22px);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-meta {
      font-size: 13px;
      color: var(--muted);
    }

    #board {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      min-height: 0;             /* flex 안에서 줄어들 수 있게 */
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 18px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 0;
    }

    .card h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }

    .value {
      font-size: clamp(26px, 3.8vw, 36px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--text);
    }

    .value small {
      font-size: 0.45em;
      font-weight: 500;
      color: var(--muted);
      margin-left: 4px;
    }

    .meta {
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.55;
    }

    .meta strong {
      color: var(--text);
      font-weight: 500;
    }

    .status {
      display: inline-block;
      margin-top: 8px;
      font-size: 11.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(154, 206, 106, 0.15);
      color: var(--success);
    }

    .status.error {
      background: rgba(247, 118, 142, 0.15);
      color: var(--error);
    }

    .error-msg {
      color: var(--error);
      font-size: 14px;
      margin-top: 8px;
    }

    /* 태블릿 */
    @media (max-width: 900px) {
      #board {
        grid-template-columns: 1fr 1fr;
      }
      #board .card:last-child {
        grid-column: 1 / -1;     /* 세 번째 카드가 아래로 넓게 */
      }
    }

    /* 모바일 */
    @media (max-width: 560px) {
      body { padding: 12px 14px; }
      #board {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      #board .card:last-child {
        grid-column: auto;
      }
      .value { font-size: 28px; }
      .meta { font-size: 12px; }
    }

    /* 아주 낮은 화면 높이 대응 */
    @media (max-height: 620px) {
      body { padding: 10px 14px; }
      header { margin-bottom: 8px; }
      .card { padding: 12px 14px; }
      .value { font-size: 24px; }
      .meta { margin-top: 8px; font-size: 11.5px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>오늘의 스팀 동접자 정보판</h1>
    <div class="header-meta">기준 시간대 · Asia/Seoul</div>
  </header>

  <div id="board">불러오는 중...</div>

  <script>
    const GAME_NAMES = {
      1623730: "팰월드",
      3240220: "GTA V Enhanced",
      578080: "PUBG"
    };

    async function load() {
      const board = document.getElementById("board");
      try {
        const res = await fetch("/api/players");
        if (!res.ok) throw new Error(`서버 오류 ${res.status}`);
        const data = await res.json();

        const queryTime = new Date(data.queriedAt).toLocaleString("ko-KR", {
          timeZone: "Asia/Seoul"
        });

        board.innerHTML = "";
        data.games.forEach(g => {
          const name = GAME_NAMES[g.appid] || g.appid;
          const div = document.createElement("div");
          div.className = "card";

          if (!g.ok) {
            div.innerHTML = `
              <h2>${name}</h2>
              <p class="error-msg">조회 실패 (status: ${g.status})</p>
              <div class="meta">
                출처: Steam Web API (AppID ${g.appid})<br>
                조회 시각: ${queryTime}
              </div>
              <span class="status error">실패</span>
            `;
          } else {
            div.innerHTML = `
              <div>
                <h2>${name}</h2>
                <div class="value">${Number(g.player_count).toLocaleString()}<small>명</small></div>
              </div>
              <div>
                <div class="meta">
                  <strong>출처</strong> Steam Web API (AppID ${g.appid})<br>
                  <strong>출처 시각</strong> ${queryTime}<br>
                  <span style="opacity:.7">(원천 시각 미제공 → 조회 시각 사용)</span><br>
                  <strong>조회 시각</strong> ${queryTime}<br>
                  <strong>기준 시간대</strong> Asia/Seoul
                </div>
                <span class="status">정상</span>
              </div>
            `;
          }
          board.appendChild(div);

          // 카드 1 확인용
          console.log(`[${name}] 원자료:`, g.raw);
          console.log(`[${name}] 화면값:`, g.player_count);
        });
      } catch (err) {
        board.innerHTML = `<p class="error-msg">오류: ${err.message}</p>`;
        console.error(err);
      }
    }

    load();
  </script>
</body>
</html>
