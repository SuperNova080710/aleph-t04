<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 진짜 정보판 · 스팀 동접자</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2e3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #7aa2f7;
      --success: #9ece6a;
      --error: #f7768e;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;          /* 가로 중앙 */
      justify-content: center;      /* 세로 중앙 */
      padding: 20px;
      line-height: 1.5;
    }

    .wrap {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: clamp(20px, 2.6vw, 26px);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .header-meta {
      font-size: 13.5px;
      color: var(--muted);
    }

    #board {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 18px 18px;
      text-align: center;           /* 카드 안 텍스트 중앙 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 210px;
    }

    .card h2 {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    .value {
      font-size: clamp(28px, 4vw, 38px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--text);
    }

    .value small {
      font-size: 0.42em;
      font-weight: 500;
      color: var(--muted);
      margin-left: 3px;
    }

    .meta {
      margin-top: 16px;
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.6;
      text-align: center;
    }

    .meta strong {
      color: var(--text);
      font-weight: 500;
    }

    .status {
      display: inline-block;
      margin-top: 12px;
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(154, 206, 106, 0.15);
      color: var(--success);
    }

    .status.error {
      background: rgba(247, 118, 142, 0.15);
      color: var(--error);
    }

    .error-msg {
      color: var(--error);
      font-size: 14px;
      margin-top: 8px;
    }

    /* 태블릿 */
    @media (max-width: 900px) {
      #board {
        grid-template-columns: 1fr 1fr;
      }
      #board .card:last-child {
        grid-column: 1 / -1;
      }
      .card {
        min-height: 190px;
      }
    }

    /* 모바일 */
    @media (max-width: 560px) {
      body { padding: 14px; }
      #board {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      #board .card:last-child {
        grid-column: auto;
      }
      .card {
        min-height: auto;
        padding: 18px 16px;
      }
      .value { font-size: 30px; }
      .meta { font-size: 12px; }
    }

    /* 낮은 화면 */
    @media (max-height: 640px) {
      body { padding: 12px; }
      .wrap { gap: 12px; }
      .card {
        min-height: 160px;
        padding: 14px 14px 12px;
      }
      .value { font-size: 26px; }
      .meta { margin-top: 10px; font-size: 11.5px; }
      .status { margin-top: 8px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>오늘의 스팀 동접자 정보판</h1>
      <div class="header-meta">기준 시간대 · Asia/Seoul</div>
    </header>

    <div id="board">불러오는 중...</div>
  </div>

  <script>
    const GAME_NAMES = {
      1623730: "팰월드",
      3240220: "GTA V Enhanced",
      578080: "PUBG"
    };

    async function load() {
      const board = document.getElementById("board");
      try {
        const res = await fetch("/api/players");
        if (!res.ok) throw new Error(`서버 오류 ${res.status}`);
        const data = await res.json();

        const queryTime = new Date(data.queriedAt).toLocaleString("ko-KR", {
          timeZone: "Asia/Seoul"
        });

        board.innerHTML = "";
        data.games.forEach(g => {
          const name = GAME_NAMES[g.appid] || g.appid;
          const div = document.createElement("div");
          div.className = "card";

          if (!g.ok) {
            div.innerHTML = `
              <h2>${name}</h2>
              <p class="error-msg">조회 실패 (status: ${g.status})</p>
              <div class="meta">
                출처: Steam Web API (AppID ${g.appid})<br>
                조회 시각: ${queryTime}
              </div>
              <span class="status error">실패</span>
            `;
          } else {
            div.innerHTML = `
              <div>
                <h2>${name}</h2>
                <div class="value">${Number(g.player_count).toLocaleString()}<small>명</small></div>
              </div>
              <div>
                <div class="meta">
                  <strong>출처</strong> Steam Web API (AppID ${g.appid})<br>
                  <strong>출처 시각</strong> ${queryTime}<br>
                  <span style="opacity:.7">(원천 시각 미제공 → 조회 시각 사용)</span><br>
                  <strong>조회 시각</strong> ${queryTime}<br>
                  <strong>기준 시간대</strong> Asia/Seoul
                </div>
                <span class="status">정상</span>
              </div>
            `;
          }
          board.appendChild(div);

          console.log(`[${name}] 원자료:`, g.raw);
          console.log(`[${name}] 화면값:`, g.player_count);
        });
      } catch (err) {
        board.innerHTML = `<p class="error-msg">오류: ${err.message}</p>`;
        console.error(err);
      }
    }

    load();
  </script>
</body>
</html>
