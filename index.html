<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 진짜 정보판 · 스팀 동접자</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2e3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #7aa2f7;
      --success: #9ece6a;
      --warn: #e0af68;
      --error: #f7768e;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.5;
    }
    .wrap {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    header { text-align: center; }
    h1 {
      font-size: clamp(20px, 2.6vw, 26px);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .header-meta { font-size: 13.5px; color: var(--muted); }

    #board {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 18px 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 230px;
    }
    .card h2 {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .value {
      font-size: clamp(28px, 4vw, 38px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .value small {
      font-size: 0.42em;
      font-weight: 500;
      color: var(--muted);
      margin-left: 3px;
    }
    .meta {
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.6;
    }
    .meta strong { color: var(--text); font-weight: 500; }

    .status {
      display: inline-block;
      margin-top: 10px;
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
    }
    .status.fresh {
      background: rgba(154, 206, 106, 0.15);
      color: var(--success);
    }
    .status.stale {
      background: rgba(224, 175, 104, 0.18);
      color: var(--warn);
    }
    .status.error {
      background: rgba(247, 118, 142, 0.15);
      color: var(--error);
    }

    .retry-btn {
      margin-top: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 12.5px;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    .retry-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .error-msg { color: var(--error); font-size: 14px; margin-top: 8px; }

    @media (max-width: 900px) {
      #board { grid-template-columns: 1fr 1fr; }
      #board .card:last-child { grid-column: 1 / -1; }
    }
    @media (max-width: 560px) {
      body { padding: 14px; }
      #board { grid-template-columns: 1fr; gap: 12px; }
      #board .card:last-child { grid-column: auto; }
      .card { min-height: auto; }
    }
    @media (max-height: 640px) {
      body { padding: 12px; }
      .wrap { gap: 12px; }
      .card { min-height: 160px; padding: 14px; }
      .value { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>오늘의 스팀 동접자 정보판</h1>
      <div class="header-meta">기준 시간대 · Asia/Seoul</div>
    </header>
    <div id="board">불러오는 중...</div>
  </div>

<script>
  const GAME_NAMES = {
    1623730: "팰월드",
    3240220: "GTA V Enhanced",
    578080: "PUBG"
  };

  function findRecord(records, appid, date) {
    if (!Array.isArray(records)) return null;
    return records.find(
      r => Number(r.appid) === Number(appid) && r.record_date === date
    ) || null;
  }

  function statusLabel(freshness, errorCode) {
    if (freshness === 'fresh' && errorCode === 'none') {
      return { text: '정상 · fresh', cls: 'fresh' };
    }
    if (freshness === 'stale') {
      const code = errorCode && errorCode !== 'none' ? errorCode : 'stale';
      return { text: `오래된 값 · ${code}`, cls: 'stale' };
    }
    return { text: `실패 · ${errorCode || 'error'}`, cls: 'error' };
  }

  function formatDelta(todayCount, yesterdayCount) {
    if (todayCount == null || yesterdayCount == null) return null;
    const delta = Number(todayCount) - Number(yesterdayCount);
    const sign = delta > 0 ? '+' : '';
    return `${sign}${delta.toLocaleString()}명`;
  }

  async function load() {
    const board = document.getElementById("board");
    board.innerHTML = "불러오는 중...";

    try {
      const res = await fetch("/api/players");
      if (!res.ok) throw new Error(`서버 오류 ${res.status}`);
      const data = await res.json();

      const queryTime = new Date(data.queriedAt).toLocaleString("ko-KR", {
        timeZone: "Asia/Seoul"
      });

      const today = data.today;
      // API가 yesterday를 안 내려주면 오늘 기준 하루 전 계산
      let yesterday = data.yesterday;
      if (!yesterday && today) {
        const d = new Date(today + 'T12:00:00+09:00');
        d.setDate(d.getDate() - 1);
        yesterday = d.toISOString().slice(0, 10);
      }

      board.innerHTML = "";

      data.games.forEach(g => {
        const name = GAME_NAMES[g.appid] || g.name || g.appid;

        const todayRec = findRecord(data.records, g.appid, today);
        const ydayRec = findRecord(data.records, g.appid, yesterday);

        const displayCount = (g.ok && g.player_count != null)
          ? g.player_count
          : (todayRec ? todayRec.player_count : null);

        const ydayCount = ydayRec ? ydayRec.player_count : null;
        const deltaText = formatDelta(displayCount, ydayCount);

        const freshness = g.freshness || (g.ok ? 'fresh' : 'stale');
        const errorCode = g.error_code || (g.ok ? 'none' : 'fetch_error');
        const badge = statusLabel(freshness, errorCode);
        const showRetry = freshness === 'stale' || !g.ok;

        const div = document.createElement("div");
        div.className = "card";

        const valueHtml = displayCount != null
          ? `<div class="value">${Number(displayCount).toLocaleString()}<small>명</small></div>`
          : `<p class="error-msg">값 없음</p>`;

        const deltaHtml = deltaText
          ? `<div style="margin-top:8px;font-size:13px;color:var(--muted)">어제 대비 <strong style="color:var(--text)">${deltaText}</strong></div>`
          : `<div style="margin-top:8px;font-size:12.5px;color:var(--muted)">어제 기록 없음</div>`;

        div.innerHTML = `
          <div>
            <h2>${name}</h2>
            ${valueHtml}
            ${deltaHtml}
          </div>
          <div>
            <div class="meta">
              <strong>출처</strong> Steam Web API (AppID ${g.appid})<br>
              <strong>출처 시각</strong> ${queryTime}<br>
              <span style="opacity:.7">(원천 시각 미제공 → 조회 시각 사용)</span><br>
              <strong>조회 시각</strong> ${queryTime}<br>
              <strong>기준 시간대</strong> Asia/Seoul<br>
              <strong>오늘</strong> ${today || '-'} · <strong>어제</strong> ${yesterday || '-'}<br>
              <strong>상태</strong> ${freshness} / ${errorCode}
            </div>
            <span class="status ${badge.cls}">${badge.text}</span>
            ${showRetry ? `<div><button class="retry-btn" type="button">다시 시도</button></div>` : ''}
          </div>
        `;

        const btn = div.querySelector('.retry-btn');
        if (btn) btn.addEventListener('click', load);

        board.appendChild(div);
      });
    } catch (err) {
      board.innerHTML = `
        <p class="error-msg">오류: ${err.message}</p>
        <button class="retry-btn" type="button" onclick="load()">다시 시도</button>
      `;
      console.error(err);
    }
  }

  load();
</script>
</body>
</html>
